# Deploy a push to `production`, the one environment this repository has. Promotion is a
# fast-forward, which carries the SHA the master gate validated:
#
#   git push origin master:production
#
# The `production` environment sets no required reviewer, so the push is the approval.
#
# CI decides when code ships and nothing else: it creates no identity or binding, runs no
# `terraform apply`, and provisions no secret.
name: cd

on:
  push:
    branches: [production]

# One deploy at a time per branch, and an in-flight run is left to finish: killing a
# deploy mid-sweep leaves some workers new and some old.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the gate on the pushed commit. The pull-request gate ran on the merge
  # preview, which is not the commit that ships.
  gate:
    uses: ./.github/workflows/nx-gate.yml
    with:
      targets: lint typecheck build test

  # `secrets: inherit` is what lets the credentials through - a called workflow gets
  # an empty `secrets` context otherwise; the environment scopes which value wins.
  deploy:
    needs: [gate]
    uses: ./.github/workflows/nx-deploy.yml
    secrets: inherit
    with:
      targets: wrangler:deploy
      environment: ${{ github.ref_name }}
