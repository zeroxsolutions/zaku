# Deploy by running an nx target for one environment. The job names that environment, which is what
# resolves its own credentials and any protection rule set on it.
#
# Deploys sweep with run-many rather than affected: workers are coupled at runtime by bindings, which
# the build graph does not model, so shipping a subset admits version skew between them.
name: nx-deploy

on:
  workflow_call:
    inputs:
      targets:
        description: 'Space-separated nx deploy targets, e.g. "wrangler:deploy".'
        required: true
        type: string
      environment:
        description: 'GitHub environment to deploy to; also the nx configuration passed as -c.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Killing a deploy leaves a partial sweep, and re-running the same commit repairs it.
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nx-setup

      - name: Deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm nx run-many -t ${{ inputs.targets }} -c '${{ inputs.environment }}'
