# This form is an inbox, not a design document. The design and plan are worked
# out when the work is picked up - do not restate them here, or the same
# decision ends up with two sources of truth.
#
# `labels:` names only a GitHub default - see the note in 1-bug.yml.
name: Change request
description: New work, or a change to existing behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Capture the problem here. The design and plan get written when the work
        starts - so keep this short and leave the solution shape to that work.

        That applies to the title too: it states the problem, not the solution,
        in under 60 characters. See CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: What problem is this solving?
      description: >
        The situation today and why it is a problem. Not the solution - that is
        the change proposal's job.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would be true if this were done?
      description: >
        Observable outcomes, not tasks. These become the proposal's success
        criteria.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Known constraints or prior art
      description: >
        Rules that bear on it, an archived change that decided something
        related, or a decision you already know is fixed.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: >
            I searched existing issues and change proposals for something that
            already covers this.
          required: false
